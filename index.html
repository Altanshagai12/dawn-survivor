<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no" />
    <meta name="theme-color" content="#09080d" />
    <title>Dawn Survivor</title>
    <link rel="stylesheet" href="./styles.css?build=20260828i" />
    <link rel="stylesheet" href="./skin-shop.css?build=20260901b" />
    <script src="https://usions.com/usion-sdk.js"></script>
    <script src="https://usions.com/vendor/phaser/4.2.1/phaser.min.js"></script>
  </head>
  <body>
    <main id="app">
      <div id="game" aria-label="Dawn Survivor game canvas"></div>
      <div class="vignette" aria-hidden="true"></div>
      <section id="boot" class="screen screen--center">
        <div class="loader"></div>
        <p data-i18n="loading">Preparing the night…</p>
      </section>

      <section id="menu" class="screen hidden" aria-labelledby="game-title">
        <header class="menu__hero">
          <p class="eyebrow">10:00 SURVIVAL</p>
          <h1 id="game-title"><span>DAWN</span><span>SURVIVOR</span></h1>
          <p data-i18n="tagline">Aim. Build. Survive until dawn.</p>
        </header>
        <div class="selection">
          <div class="selection__group selection__group--heroes" aria-label="Hero selection">
            <div class="section-title"><span data-i18n="hunter">Hunter</span><strong id="hero-stat"></strong></div>
            <div id="hero-list" class="card-strip"></div>
            <p id="hero-description" class="loadout-detail loadout-detail--passive"></p>
            <div class="skin-selection">
              <div class="section-title section-title--skin"><span id="skin-section-title">PREMIUM SKIN</span></div>
              <div id="skin-list" class="skin-strip"></div>
            </div>
          </div>
          <div class="selection__group selection__group--weapons" aria-label="Weapon selection">
            <div class="section-title"><span data-i18n="weapon">Weapon</span><strong id="weapon-stat"></strong></div>
            <div id="weapon-list" class="card-strip card-strip--weapons"></div>
            <p id="weapon-description" class="loadout-detail"></p>
          </div>
        </div>
        <p id="movement-description" class="loadout-detail loadout-detail--movement"></p>
        <button id="start-button" class="primary" data-i18n="begin">ENTER THE NIGHT</button>
        <p class="controls-copy" data-i18n="controls">WASD + mouse · dual touch sticks</p>
      </section>

      <section id="skin-modal" class="modal hidden" aria-labelledby="skin-name">
        <div class="modal__panel skin-panel">
          <div class="skin-panel__visual">
            <img id="skin-preview" class="skin-panel__preview" alt="Premium hero, weapon, and projectile skin pack" />
            <p id="skin-live-label" class="skin-live__label">LIVE GAMEPLAY PREVIEW</p>
            <div class="skin-live" aria-label="Animated gameplay-scale skin preview">
              <i id="skin-live-vfx" class="skin-live__vfx" aria-hidden="true"></i>
              <i id="skin-live-hero" class="skin-live__hero" aria-hidden="true"></i>
              <img id="skin-live-weapon" class="skin-live__weapon" alt="Selected skin weapon" />
            </div>
            <div id="skin-weapon-tabs" class="skin-weapon-tabs" aria-label="Skin weapon previews"></div>
          </div>
          <div class="skin-panel__copy">
            <p id="skin-eyebrow" class="eyebrow">FREE AAA PROTOTYPE</p>
            <h2 id="skin-name"></h2>
            <p id="skin-description"></p>
            <small id="skin-contents" class="skin-panel__contents"></small>
            <strong id="skin-price" class="skin-panel__price"></strong>
            <p id="skin-status" class="skin-panel__status" aria-live="polite"></p>
            <button id="skin-audio-shot" class="secondary skin-audio" type="button">PLAY WEAPON AUDIO</button>
            <button id="skin-action" class="primary" type="button"></button>
            <button id="skin-close" class="secondary" type="button">CLOSE</button>
          </div>
        </div>
      </section>

      <section id="hud" class="hud hidden" aria-live="polite">
        <div class="hud__top">
          <div class="health-wrap">
            <div id="hearts" class="hearts"></div>
            <small id="damage-source" class="damage-source hidden"></small>
          </div>
          <div class="timer-wrap"><span id="timer">10:00</span><small data-i18n="untilDawn">UNTIL DAWN</small></div>
          <button id="pause-button" class="icon-button" aria-label="Pause">Ⅱ</button>
        </div>
        <div class="boss-bar hidden" id="boss-bar"><span id="boss-name"></span><i><b id="boss-fill"></b></i></div>
        <div class="hud__bottom">
          <div class="xp"><i><b id="xp-fill"></b></i><span id="level">LV 1</span></div>
          <div class="ammo">
            <span id="ammo">6 / 6</span>
          </div>
        </div>
      </section>

      <section id="choice-modal" class="modal hidden" aria-labelledby="choice-title">
        <div class="modal__panel choice-panel">
          <p class="eyebrow" id="choice-kicker">LEVEL UP</p>
          <h2 id="choice-title" data-i18n="chooseUpgrade">Choose an upgrade</h2>
          <div id="choice-list" class="choice-tabs" role="tablist"></div>
          <article id="choice-detail" class="choice-detail" aria-live="polite">
            <div id="choice-detail-icon" class="choice-detail__icon"></div>
            <div class="choice-detail__copy">
              <em id="choice-detail-tree"></em>
              <h3 id="choice-detail-name"></h3>
              <p id="choice-detail-description"></p>
              <div id="choice-detail-path" class="choice-detail__path"></div>
            </div>
          </article>
          <div class="choice-actions">
            <button id="choice-confirm" class="primary">CHOOSE</button>
            <button id="reroll-button" class="secondary hidden" data-i18n="reroll">REROLL</button>
          </div>
        </div>
      </section>

      <section id="pause-modal" class="modal hidden">
        <div class="modal__panel modal__panel--small">
          <p class="eyebrow">NIGHT PAUSED</p>
          <h2 data-i18n="paused">Paused</h2>
          <button id="resume-button" class="primary" data-i18n="resume">RESUME</button>
          <button id="quit-button" class="secondary" data-i18n="endRun">END RUN</button>
        </div>
      </section>

      <section id="result-modal" class="modal hidden" aria-labelledby="result-title">
        <div class="modal__panel result-panel">
          <p class="eyebrow" id="result-kicker"></p>
          <h2 id="result-title"></h2>
          <p id="result-cause" class="result-cause hidden"></p>
          <div class="result-stats">
            <div><strong id="result-score">00:00</strong><span data-i18n="survived">SURVIVED</span></div>
            <div><strong id="result-kills">0</strong><span data-i18n="kills">KILLS</span></div>
            <div><strong id="result-level">1</strong><span data-i18n="level">LEVEL</span></div>
          </div>
          <div id="friends-board" class="friends-board"></div>
          <button id="again-button" class="primary" data-i18n="again">PLAY AGAIN</button>
          <button id="menu-button" class="secondary" data-i18n="loadout">CHANGE LOADOUT</button>
        </div>
      </section>

      <div id="touch-controls" class="touch-controls hidden" aria-hidden="true">
        <div id="move-stick" class="stick"><i></i></div>
        <button id="ability-button" class="ability-button hidden" type="button">DASH</button>
        <div id="aim-stick" class="stick stick--aim"><i></i></div>
      </div>
      <div id="toast" class="toast hidden"></div>
    </main>
    <script type="module" src="./src/main.js?build=20260901b"></script>
  </body>
</html>
